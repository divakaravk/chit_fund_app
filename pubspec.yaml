name: chit_fund_app
description: "ChitFlow - Smart Chit Fund Management SaaS App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  dio: ^5.4.3
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  fl_chart: ^0.68.0
  iconsax: ^0.0.8
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  another_flushbar: ^1.12.30

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "asssets/images/chitfundlogo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1E3A5F"
  adaptive_icon_foreground: "asssets/images/chitfundlogo.png"
  web:
    generate: false
  windows:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - asssets/images/
